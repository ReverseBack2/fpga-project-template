name: Verify simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulate:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y verilator g++ make
      - name: Install macOS simulation tools
        if: runner.os == 'macOS'
        run: brew install verilator
      - name: Verify Make commands, test selection, and incremental compilation
        run: sh .github/verify.sh
