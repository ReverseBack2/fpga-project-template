schema_version = 1

[project]
name = "counter-example"

[simulation]
command = ["python3", "sim/run.py"]
waveform = "build/sim/dump.vcd"
# Save a GTKWave layout here after choosing your signals.
wave_layout = "sim/waves/counter.gtkw"

[remote]
inputs = ["rtl", "tb", "sim", "fpga", "project.toml"]
entrypoint = "fpga/build.tcl"

[vivado]
version = "2026.1"
# Set this to your exact FPGA part, or use fpga synth --part <part>.
part = ""
jobs = 2
